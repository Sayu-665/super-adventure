name: Build OpenSurf

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref; superseded branch/PR runs are cancelled, tag (release) runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets cannot be referenced in `if:` directly, so expose only whether one is set.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Packages are installed explicitly below (skips the obsolete "tools" default).
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Optional: without these secrets the release APK is signed with the debug key.
      - name: Configure release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          # Strip whitespace/CRLF so wrapped or pasted base64 decodes cleanly.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          {
            echo "OPENSURF_KEYSTORE=$keystore"
            echo "OPENSURF_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "OPENSURF_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            # PKCS12 keystores use the store password for the key as well.
            echo "OPENSURF_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Release signing configured with alias '$ANDROID_KEY_ALIAS'."

      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opensurf-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare Linux for headless Electron
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox relies on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke

      - name: Package installers
        run: npm run dist
        env:
          # No code signing in CI (skips macOS keychain lookup).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Only the installers: unpacked dirs, blockmaps and builder yml files are left out.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opensurf-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            !desktop/dist/__uninstaller*
          if-no-files-found: error

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore

  release:
    name: GitHub release
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opensurf-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -l release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
