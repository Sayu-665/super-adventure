name = "dh_generic"
description = "Distant Horizons 3.3 BLAZE_3D generic objects (beacon beams, clouds, custom API boxes). 20-byte vertices: vPosition RGB32_FLOAT (vec3), aColor RGBA8_UNORM (vec4, normalized 0..1), aMaterial R8_UINT (uint, DH_BLOCK_* id) followed by 3 padding bytes. DH's vert.vsh comments aColor as RGBA_FLOAT_COLOR, but BlazeDhGenericObjectRenderer (verified in the 3.3.4 26.3 jar) binds BlazeDhVertexFormatUtil.RGBA_UBYTE_COLOR = GpuFormat.RGBA8_UNORM. DH binds vertUniformBlock and the sampler uLightMap by name."

[[inputs]]
name = "vPosition"
type = "vec3"
location = 0
[[inputs]]
name = "aColor"
type = "vec4"
location = 1
[[inputs]]
name = "aMaterial"
type = "uint"
location = 2

[[blocks]]
name = "vertUniformBlock"
instance = "sb_hDhGeneric"
members = "ivec3 uOffsetChunk; vec3 uOffsetSubChunk; ivec3 uCameraPosChunk; vec3 uCameraPosSubChunk; mat4 uProjectionMvm; int uSkyLight; int uBlockLight; float uNorthShading; float uSouthShading; float uEastShading; float uWestShading; float uTopShading; float uBottomShading;"

[[samplers]]
name = "uLightMap"
type = "sampler2D"
provides = ["lightmap"]

[semantics]
position = "vec4(vPosition + vec3(sb_hDhGeneric.uOffsetChunk - sb_hDhGeneric.uCameraPosChunk) * 16.0 + (sb_hDhGeneric.uOffsetSubChunk - sb_hDhGeneric.uCameraPosSubChunk), 1.0)"
color = "aColor"
uv0 = "vec4(0.0, 0.0, 0.0, 1.0)"
lightmap = "vec4((float(sb_hDhGeneric.uBlockLight) + 0.5) / 16.0, (float(sb_hDhGeneric.uSkyLight) + 0.5) / 16.0, 0.0, 1.0)"
lightmap_matrix = "mat4(1.0)"
# Face normal from the vertex index (24 vertices per box: N, S, W, E, bottom, top), as in
# Iris DHGenericTransformer and DH's own directional shading.
normal = "sb_dhGenericNormal()"
model_view = "gbufferModelView"
projection = "dhProjection"
texture_matrix = "mat4(1.0)"

[[globals]]
name = "dhMaterialId"
type = "int"
stage = "vertex"
init = "int(aMaterial)"

[code]
vertex = """
vec3 sb_dhGenericNormal() {
    int face = (gl_VertexIndex % 24) / 4;
    if (face == 0) return vec3(0.0, 0.0, -1.0);
    if (face == 1) return vec3(0.0, 0.0, 1.0);
    if (face == 2) return vec3(-1.0, 0.0, 0.0);
    if (face == 3) return vec3(1.0, 0.0, 0.0);
    if (face == 4) return vec3(0.0, -1.0, 0.0);
    return vec3(0.0, 1.0, 0.0);
}
"""
fragment = """
// Iris DHGenericTransformer: generic DH objects (beacon beams, clouds, API boxes) have no
// block texture; packs share their dh_terrain fragment code, which calls these.
bool dh_hasTexture() { return false; }
vec4 dh_sampleTexture() { return vec4(1.0); }
"""
