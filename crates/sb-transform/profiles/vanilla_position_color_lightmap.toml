name = "vanilla_position_color_lightmap"
description = "Minecraft 26.3 POSITION_COLOR_LIGHTMAP format (pipeline/leash) with DynamicTransforms: Position, Color, UV2."

[[inputs]]
name = "Position"
type = "vec3"
location = 0
[[inputs]]
name = "Color"
type = "vec4"
location = 1
[[inputs]]
name = "UV2"
type = "ivec2"
location = 2

[[blocks]]
name = "DynamicTransforms"
instance = "sb_hDynamic"
members = "mat4 ModelViewMat; mat4 TextureMat; vec4 ColorModulator; vec3 ModelOffset;"

[[samplers]]
name = "Sampler2"
type = "sampler2D"
provides = ["lightmap"]

[semantics]
position = "vec4(Position + sb_hDynamic.ModelOffset, 1.0)"
color = "Color * sb_hDynamic.ColorModulator"
# No texture coordinates in this format: Iris's VanillaTransformer uses the texel centre.
uv0 = "vec4(0.5, 0.5, 0.0, 1.0)"
lightmap = "vec4(vec2(UV2), 0.0, 1.0)"
model_view = "sb_hDynamic.ModelViewMat"
projection = "projectionMatrix"
texture_matrix = "sb_hDynamic.TextureMat"
chunk_offset = "sb_hDynamic.ModelOffset"
