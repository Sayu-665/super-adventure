name = "vanilla_clouds"
description = "Minecraft 26.3 clouds (pipeline/clouds, pipeline/flat_clouds): no vertex buffer. Every quad is decoded from gl_VertexIndex and the CloudFaces texel buffer (three R8_SINT texels per face: cell x, cell z, direction and flags) with CloudInfo, as core/clouds.vsh does. gl_Color carries the per-face shading times CloudColor; there is no texture (uv0 is the texel centre)."

[[blocks]]
name = "DynamicTransforms"
instance = "sb_hDynamic"
members = "mat4 ModelViewMat; mat4 TextureMat; vec4 ColorModulator; vec3 ModelOffset;"
[[blocks]]
name = "CloudInfo"
instance = "sb_hCloud"
members = "vec4 CloudColor; vec3 CloudOffset; vec3 CellSize;"

[[samplers]]
name = "CloudFaces"
type = "isamplerBuffer"

[semantics]
position = "vec4(sb_cloudPosition(), 1.0)"
color = "sb_cloudShade() * sb_hCloud.CloudColor"
uv0 = "vec4(0.5, 0.5, 0.0, 1.0)"
normal = "sb_cloudNormal()"
model_view = "sb_hDynamic.ModelViewMat"
projection = "projectionMatrix"
chunk_offset = "vec3(0.0)"

[code]
vertex = """
// Corners of the unit cell, four per face in the order the CPU side emits faces:
// bottom, top, north, south, west, east.
const vec3 sb_cloudCorners[24] = vec3[24](
    vec3(1.0, 0.0, 0.0), vec3(1.0, 0.0, 1.0), vec3(0.0, 0.0, 1.0), vec3(0.0, 0.0, 0.0),
    vec3(0.0, 1.0, 0.0), vec3(0.0, 1.0, 1.0), vec3(1.0, 1.0, 1.0), vec3(1.0, 1.0, 0.0),
    vec3(0.0, 0.0, 0.0), vec3(0.0, 1.0, 0.0), vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0),
    vec3(1.0, 0.0, 1.0), vec3(1.0, 1.0, 1.0), vec3(0.0, 1.0, 1.0), vec3(0.0, 0.0, 1.0),
    vec3(0.0, 0.0, 1.0), vec3(0.0, 1.0, 1.0), vec3(0.0, 1.0, 0.0), vec3(0.0, 0.0, 0.0),
    vec3(1.0, 0.0, 0.0), vec3(1.0, 1.0, 0.0), vec3(1.0, 1.0, 1.0), vec3(1.0, 0.0, 1.0));
const vec3 sb_cloudFaceNormals[6] = vec3[6](
    vec3(0.0, -1.0, 0.0), vec3(0.0, 1.0, 0.0), vec3(0.0, 0.0, -1.0),
    vec3(0.0, 0.0, 1.0), vec3(-1.0, 0.0, 0.0), vec3(1.0, 0.0, 0.0));
const float sb_cloudFaceShades[6] = float[6](0.7, 1.0, 0.8, 0.8, 0.9, 0.9);

// Direction (bits 0-2) and flags of the quad: 16 inside face, 32 top colour,
// 64 / 128 low bit of the cell z / x coordinate.
int sb_cloudFlags() {
    return texelFetch(CloudFaces, gl_VertexIndex / 4 * 3 + 2).r;
}

vec3 sb_cloudPosition() {
    int base = gl_VertexIndex / 4 * 3;
    int flags = texelFetch(CloudFaces, base + 2).r;
    int corner = gl_VertexIndex % 4;
    if ((flags & 16) != 0) {
        corner = 3 - corner;
    }
    float cellX = float(texelFetch(CloudFaces, base).r * 2 + ((flags >> 7) & 1));
    float cellZ = float(texelFetch(CloudFaces, base + 1).r * 2 + ((flags >> 6) & 1));
    vec3 local = sb_cloudCorners[(flags & 7) * 4 + corner] + vec3(cellX, 0.0, cellZ);
    return local * sb_hCloud.CellSize + sb_hCloud.CloudOffset;
}

vec3 sb_cloudNormal() {
    int flags = sb_cloudFlags();
    vec3 n = sb_cloudFaceNormals[flags & 7];
    return (flags & 16) != 0 ? -n : n;
}

vec4 sb_cloudShade() {
    int flags = sb_cloudFlags();
    float shade = (flags & 32) != 0 ? 1.0 : sb_cloudFaceShades[flags & 7];
    return vec4(shade, shade, shade, 1.0);
}
"""
