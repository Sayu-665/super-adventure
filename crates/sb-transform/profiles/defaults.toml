# Fallback semantics used when a profile does not define one.
name = "defaults"
description = "Default compatibility semantics"

[semantics]
position = "vec4(0.0, 0.0, 0.0, 1.0)"
color = "vec4(1.0)"
uv0 = "vec4(0.0, 0.0, 0.0, 1.0)"
lightmap = "vec4(240.0, 240.0, 0.0, 1.0)"
# GL's initial current normal; Iris uses it for vertex formats without normals.
normal = "vec3(0.0, 0.0, 1.0)"
entity = "vec4(-1.0, 0.0, 0.0, 0.0)"
mid_tex_coord = "vec4(0.0, 0.0, 0.0, 1.0)"
tangent = "vec4(1.0, 0.0, 0.0, 1.0)"
mid_block = "vec4(0.0)"
overlay = "ivec2(0, 10)"
model_view = "modelViewMatrix"
projection = "projectionMatrix"
texture_matrix = "mat4(1.0)"
# gl_TextureMatrix[1] / [2] (OptiFine/Iris lightmap matrix: scale 1/256, offset 1/32)
lightmap_matrix = "mat4(vec4(0.00390625, 0.0, 0.0, 0.0), vec4(0.0, 0.00390625, 0.0, 0.0), vec4(0.0, 0.0, 0.00390625, 0.0), vec4(0.03125, 0.03125, 0.03125, 1.0))"
# normal_matrix default (when a profile does not define it): mat3(transpose(inverse(model_view)))
chunk_offset = "vec3(0.0)"
