name = "vanilla_terrain_section_ext"
description = "Minecraft 26.3 terrain on the per-section path (pipeline/*_terrain without _multidraw, used when MultiDrawIndirect is unavailable) with ShaderBridge's extended chunk vertex: the BLOCK elements followed by the same extension attributes as vanilla_terrain (sb_Normal, sb_Entity, sb_MidTexCoord, sb_Tangent, sb_MidBlock; 52 bytes), with the section origin and visibility in the ChunkSection block instead of instanced attributes. The Java mod meshes chunk sections in this format while a shader pack is active."
# Camera-relative world geometry: in the shadow pass (TransformOptions::is_shadow_pass) the
# model_view / projection semantics become shadowModelView / shadowProjection, as in Iris.
world_space = true

[[inputs]]
name = "Position"
type = "vec3"
location = 0
[[inputs]]
name = "Color"
type = "vec4"
location = 1
[[inputs]]
name = "UV0"
type = "vec2"
location = 2
[[inputs]]
name = "UV2"
type = "ivec2"
location = 3
[[inputs]]
name = "sb_Normal"
type = "vec3"
location = 4
[[inputs]]
name = "sb_Entity"
type = "ivec2"
location = 5
[[inputs]]
name = "sb_MidTexCoord"
type = "vec2"
location = 6
[[inputs]]
name = "sb_Tangent"
type = "vec4"
location = 7
[[inputs]]
name = "sb_MidBlock"
type = "ivec4"
location = 8

[[blocks]]
name = "Globals"
instance = "sb_hGlobals"
members = "ivec3 CameraBlockPos; float GlintAlpha; vec3 CameraOffset; float GameTime; vec2 ScreenSize; int MenuBlurRadius; int UseRgss;"
[[blocks]]
name = "TerrainUniform"
instance = "sb_hTerrain"
members = "mat4 ModelViewMat; ivec2 TextureSize;"
[[blocks]]
name = "ChunkSection"
instance = "sb_hSection"
members = "ivec3 ChunkPosition; float ChunkVisibility;"

[[samplers]]
name = "Sampler0"
type = "sampler2D"
provides = ["gtexture"]
[[samplers]]
name = "Sampler2"
type = "sampler2D"
provides = ["lightmap"]

[semantics]
position = "vec4(Position + vec3(sb_hSection.ChunkPosition - sb_hGlobals.CameraBlockPos) + sb_hGlobals.CameraOffset, 1.0)"
color = "Color"
uv0 = "vec4(UV0, 0.0, 1.0)"
lightmap = "vec4(vec2(UV2), 0.0, 1.0)"
normal = "sb_Normal"
# Iris patchIntegerAttribute: vec4(id, renderType, 0, 1).
entity = "vec4(float(sb_Entity.x), float(sb_Entity.y), 0.0, 1.0)"
mid_tex_coord = "vec4(sb_MidTexCoord, 0.0, 1.0)"
tangent = "sb_Tangent"
mid_block = "vec4(sb_MidBlock)"
model_view = "sb_hTerrain.ModelViewMat"
projection = "gbufferProjection"
texture_matrix = "mat4(1.0)"
chunk_offset = "(vec3(sb_hSection.ChunkPosition - sb_hGlobals.CameraBlockPos) + sb_hGlobals.CameraOffset)"

[[globals]]
name = "mc_chunkFade"
type = "float"
stage = "vertex"
init = "sb_hSection.ChunkVisibility"
