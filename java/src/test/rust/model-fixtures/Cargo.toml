# Generates the serde JSON fixtures of the Java model tests
# (java/src/test/resources/dev/shaderbridge/model/{serde_shapes,compiled_pack_serde}.json) and the
# builtin-uniform registry listing of the Java uniform tests
# (java/src/test/resources/dev/shaderbridge/uniforms/builtin_registry.tsv).
# Standalone package (not a workspace member); see README.md.
[package]
name = "sb-java-model-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sb-core = { path = "../../../../../crates/sb-core" }
sb-uniforms = { path = "../../../../../crates/sb-uniforms" }
serde = "1"
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[workspace]
