plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/shaderbridge.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:distanthorizons:${project.dh_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// ---------------------------------------------------------------------------------------------
// Native library (crates/sb-jni) built with cargo and packaged as /natives/<os>-<arch>/<lib>.
// Skippable with -PskipNative; skipped with a warning when cargo or the sb-jni crate is missing.
// The packaged copy has its debug info stripped (the release profile keeps line tables, ~10x
// the code size); -PkeepNativeDebugInfo packages it unstripped.
// ---------------------------------------------------------------------------------------------

def repositoryRoot = rootProject.projectDir.parentFile
def skipNative = project.hasProperty("skipNative")
def nativeResourceRoot = layout.buildDirectory.dir("generated/natives")

static String nativePlatform() {
    String os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    String osName = os.contains("win") ? "windows" : (os.contains("mac") || os.contains("darwin")) ? "macos" : "linux"
    String archName = (arch == "amd64" || arch == "x86_64") ? "x86_64" : (arch == "aarch64" || arch == "arm64") ? "aarch64" : arch
    return osName + "-" + archName
}

static String nativeLibraryFile() {
    String os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    return os.contains("win") ? "sb_jni.dll" : (os.contains("mac") || os.contains("darwin")) ? "libsb_jni.dylib" : "libsb_jni.so"
}

abstract class BuildNativeTask extends DefaultTask {
    @Internal abstract DirectoryProperty getRepoRoot()
    @Internal abstract DirectoryProperty getCargoTargetDir()
    @Input abstract Property<String> getPlatform()
    @Input abstract Property<String> getLibraryFile()
    @Input abstract Property<Boolean> getStripDebugInfo()
    @OutputDirectory abstract DirectoryProperty getOutputRoot()

    @Inject abstract ExecOperations getExecOperations()

    @TaskAction
    void build() {
        File stagingDir = new File(outputRoot.get().asFile, "natives/" + platform.get())
        stagingDir.deleteDir()
        File root = repoRoot.get().asFile
        if (!new File(root, "crates/sb-jni/Cargo.toml").isFile()) {
            logger.warn("buildNative: crates/sb-jni not found; the jar will not contain the native library")
            return
        }
        if (!cargoAvailable()) {
            logger.warn("buildNative: cargo not found on PATH; the jar will not contain the native library")
            return
        }
        execOperations.exec {
            workingDir root
            commandLine "cargo", "build", "-p", "sb-jni", "--release"
        }
        File library = new File(cargoTargetDir.get().asFile, "release/" + libraryFile.get())
        if (!library.isFile()) {
            logger.warn("buildNative: cargo did not produce {}; the jar will not contain the native library", library)
            return
        }
        stagingDir.mkdirs()
        File staged = new File(stagingDir, libraryFile.get())
        java.nio.file.Files.copy(library.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        if (stripDebugInfo.get()) {
            stripDebug(staged)
        }
        logger.lifecycle("buildNative: packaged {} as natives/{}/{} ({} bytes)", library, platform.get(), libraryFile.get(), staged.length())
    }

    /** Removes debug sections (symbols stay, so native backtraces keep function names). */
    private void stripDebug(File staged) {
        String os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        if (os.contains("win")) {
            return // MSVC keeps debug info in separate .pdb files
        }
        List<String> command = (os.contains("mac") || os.contains("darwin"))
            ? ["strip", "-S", staged.absolutePath]
            : ["strip", "--strip-debug", staged.absolutePath]
        try {
            def output = new ByteArrayOutputStream()
            def result = execOperations.exec {
                commandLine command
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                logger.warn("buildNative: '{}' failed ({}); packaging the library with debug info", command.join(" "), output.toString().trim())
            }
        } catch (Exception e) {
            logger.warn("buildNative: strip is not available ({}); packaging the library with debug info", e.message)
        }
    }

    private boolean cargoAvailable() {
        try {
            def output = new ByteArrayOutputStream()
            def result = execOperations.exec {
                commandLine "cargo", "--version"
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            return result.exitValue == 0
        } catch (Exception ignored) {
            return false
        }
    }
}

// Where cargo puts its output: $CARGO_TARGET_DIR, or <repo>/target.
def cargoTargetRoot = new File(System.getenv("CARGO_TARGET_DIR") ?: new File(repositoryRoot, "target").path)

def buildNative = tasks.register("buildNative", BuildNativeTask) {
    group = "build"
    description = "Builds crates/sb-jni with cargo and stages it as a jar resource (skip with -PskipNative)."
    repoRoot.set(repositoryRoot)
    cargoTargetDir.set(cargoTargetRoot)
    platform.set(nativePlatform())
    libraryFile.set(nativeLibraryFile())
    stripDebugInfo.set(!project.hasProperty("keepNativeDebugInfo"))
    outputRoot.set(nativeResourceRoot)
    onlyIf("not disabled with -PskipNative") { !skipNative }
    // cargo tracks its own inputs; always ask it.
    outputs.upToDateWhen { false }
}

sourceSets.main.resources.srcDir(nativeResourceRoot)

processResources {
    def modVersion = project.version
    dependsOn buildNative
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:all,-serial,-processing,-classfile", "-Werror"]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn buildNative
    exclude "natives/**"
}

test {
    useJUnitPlatform()
    // Minecraft's log4j configuration writes logs/ into the working directory.
    def testRunDir = layout.buildDirectory.dir("test-run").get().asFile
    workingDir = testRunDir
    doFirst { testRunDir.mkdirs() }
    systemProperty "shaderbridge.repoRoot", repositoryRoot.absolutePath
    systemProperty "shaderbridge.nativeDir", nativeResourceRoot.get().asFile.absolutePath

    // The native smoke tests load the library cargo built (target/release/libsb_jni.so, honouring
    // $CARGO_TARGET_DIR) when buildNative produced it, and skip themselves otherwise (-PskipNative,
    // no cargo). NativeCorpusSmokeTest also needs a shader pack corpus directory containing
    // ComplementaryReimagined: -Pshaderbridge.corpus=<dir> or $SB_CORPUS_DIR.
    dependsOn buildNative
    def builtLibrary = new File(cargoTargetRoot, "release/" + nativeLibraryFile())
    def corpusDir = project.findProperty("shaderbridge.corpus") ?: System.getenv("SB_CORPUS_DIR")
    inputs.property("shaderbridge.corpus", corpusDir == null ? "" : file(corpusDir).absolutePath)
    doFirst {
        if (!skipNative && builtLibrary.isFile()) {
            systemProperty "shaderbridge.native", builtLibrary.absolutePath
        }
        if (corpusDir != null) {
            systemProperty "shaderbridge.corpus", file(corpusDir).absolutePath
        }
    }
}
