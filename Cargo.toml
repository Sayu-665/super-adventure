[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sayu-665/super-adventure"

[workspace.dependencies]
sb-core = { path = "crates/sb-core" }
sb-pack = { path = "crates/sb-pack" }
sb-preprocess = { path = "crates/sb-preprocess" }
sb-expr = { path = "crates/sb-expr" }
sb-uniforms = { path = "crates/sb-uniforms" }
sb-transform = { path = "crates/sb-transform" }
sb-compile = { path = "crates/sb-compile" }
sb-pipeline = { path = "crates/sb-pipeline" }
sb-runtime = { path = "crates/sb-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
rayon = "1"
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
blake3 = "1"
glsl-lang = { version = "0.8", features = ["lexer-full"] }
glslang = "0.8"
spirq = "1"
ash = "0.38"
jni = "0.21"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
pretty_assertions = "1"

[profile.release]
debug = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
